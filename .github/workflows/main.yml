name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq "$(ls -1 AuraMotion-Fabric*.zip | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle build
        working-directory: auramotion
      - uses: actions/upload-artifact@v4
        with:
          name: auramotion-jar
          path: auramotion/build/libs/*.jar
